site_name: arapy-cli
site_description: Arabic amounts in words (تفقيط), digits, normalization, sorting, ordinals and dates, from the command line.
site_url: https://aaltatan.github.io/arapy-cli/
repo_url: https://github.com/aaltatan/arapy-cli
repo_name: aaltatan/arapy-cli
edit_uri: edit/main/docs/


theme:
  name: material
  icon:
    logo: material/abjad-arabic
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Installation: install.md
  - User guide:
      - guide/index.md
      - Numbers in words: guide/words.md
      - Currencies and amounts: guide/currencies.md
      - Reading words back: guide/parse.md
      - Money and numbers in digits: guide/formatting.md
      - Digits: guide/digits.md
      - Normalizing and sorting: guide/text.md
      - Ordinals: guide/ordinals.md
      - Dates and Hijri dates: guide/dates.md
      - Many values and pipes: guide/pipes.md
  - Recipes: recipes.md
  - Reference:
      - reference/index.md
      - Commands and options: reference/commands.md
      - Currency files: reference/currency-files.md
      - Date directives: reference/date-directives.md
      - Errors and exit codes: reference/errors.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aaltatan/arapy-cli
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/arapy-cli/
