[project]
name = "arapy-cli"
version = "0.1.0"
description = "Arabic amounts in words (تفقيط), digits, normalization, sorting, ordinals and dates, from the command line."
readme = "README.md"
authors = [
    { name = "aaltatan", email = "a.altatan@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["arabic", "tafqeet", "numbers", "words", "hijri", "dates", "cli"]
dependencies = [
    "arapy[hijri]>=0.1.0",
    "typer>=0.29.2",
    "typer-di>=0.1.5",
    "typer-swissknife>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/aaltatan/arapy-cli"
Documentation = "https://aaltatan.github.io/arapy-cli/"
Repository = "https://github.com/aaltatan/arapy-cli"
Issues = "https://github.com/aaltatan/arapy-cli/issues"

[project.scripts]
arapy = "arapy_cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
docs = [
    "mkdocs-material>=9.8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "CPY",     # no copyright headers
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "FBT001",  # typer flags are boolean positional parameters
    "FBT002",
    "PLR0913", # typer commands take their options as parameters
    "PLR0917",
    "RUF001",  # Arabic text in help strings is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "PLR2004", "S101", "ANN", "ARG", "E501", "RUF001"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# these ship no type hints / no py.typed marker
module = ["typer_swissknife", "typer_swissknife.*"]
ignore_missing_imports = true
follow_untyped_imports = true
